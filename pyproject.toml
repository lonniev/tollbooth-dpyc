[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tollbooth-dpyc"
version = "0.55.0"
description = "Don't Pester Your Customer™ — Bitcoin Lightning micropayments for MCP servers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Lonnie VanZandt" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx==0.28.1",
    "pynostr==0.7.0",
    # AES-256-GCM in vault_encryption.py is sourced from `cryptography`. Pinning
    # an explicit floor keeps a fresh install from transitively pulling an older
    # version with known CVEs. 46.0.5 is the floor that includes the 2024-2025
    # fix cohort consumers of this wheel rely on.
    "cryptography>=46.0.5",
]

[project.optional-dependencies]
nostr = [
    "websocket-client>=1.6.0",
]
# The tollbooth.authority subpackage (register_authority_tools, tenant
# provisioning) — Authority deployments install this extra.
authority = [
    "pydantic-settings>=2.0",
]
qr = ["segno>=1.6.0"]
ots = []  # Reserved — no extra deps needed (uses stdlib hashlib + existing httpx)
x402 = [
    "x402>=2.8.0",
    "eth-account>=0.13.0",
]
constraints = []  # No external deps — stdlib only (datetime, zoneinfo, re)
# Durable, detached async-job execution via PrefectClosureExecutor
# (tollbooth/async_executor.py). Only operators who opt into detached
# execution install this — prefect is imported lazily, never at module load.
prefect = [
    "prefect>=3.0",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/lonniev/tollbooth-dpyc"
Repository = "https://github.com/lonniev/tollbooth-dpyc"
Issues = "https://github.com/lonniev/tollbooth-dpyc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tollbooth"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["tollbooth"]
branch = true
# Relay drains and audit/notify publishers run on worker threads
# (asyncio.to_thread / threading.Thread) — measure them too.
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
# Report-only for now; a ratchet gate (--cov-fail-under) lands with M2.5
# once the tools/ extraction (M2.1) raises the measured floor.

[tool.mypy]
# Blocking gate (audit M2.5). The package type-checks clean at default
# strictness; do NOT add per-file overrides to silence new errors — fix the
# type, the way the 0.44.9 tranche bug and the 0.44.10 proof bug were caught.
files = ["src/tollbooth"]
ignore_missing_imports = true
