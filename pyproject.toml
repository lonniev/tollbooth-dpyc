[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tollbooth-dpyc"
version = "0.28.0"
description = "Don't Pester Your Customer™ — Bitcoin Lightning micropayments for MCP servers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Lonnie VanZandt" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx==0.28.1",
    "pynostr==0.7.0",
    # AES-256-GCM in vault_encryption.py is sourced from `cryptography`. Pinning
    # an explicit floor keeps a fresh install from transitively pulling an older
    # version with known CVEs. 46.0.5 is the floor that includes the 2024-2025
    # fix cohort consumers of this wheel rely on.
    "cryptography>=46.0.5",
]

[project.optional-dependencies]
nostr = [
    "websocket-client>=1.6.0",
]
qr = ["segno>=1.6.0"]
ots = []  # Reserved — no extra deps needed (uses stdlib hashlib + existing httpx)
x402 = [
    "x402>=2.8.0",
    "eth-account>=0.13.0",
]
constraints = []  # No external deps — stdlib only (datetime, zoneinfo, re)
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/lonniev/tollbooth-dpyc"
Repository = "https://github.com/lonniev/tollbooth-dpyc"
Issues = "https://github.com/lonniev/tollbooth-dpyc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tollbooth"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "F821"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
