[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tollbooth-dpyc"
version = "0.87.2"
description = "Don't Pester Your Customer™ — Bitcoin Lightning micropayments for MCP servers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Lonnie VanZandt" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx==0.28.1",
    "pynostr==0.7.0",
    # AES-256-GCM in vault_encryption.py is sourced from `cryptography`. Pinning
    # an explicit floor keeps a fresh install from transitively pulling an older
    # version with known CVEs. 46.0.5 is the floor that includes the 2024-2025
    # fix cohort consumers of this wheel rely on.
    "cryptography>=46.0.5",
]

[project.optional-dependencies]
nostr = [
    "websocket-client>=1.6.0",
]
# The tollbooth.authority subpackage (register_authority_tools, tenant
# provisioning) — Authority deployments install this extra.
authority = [
    "pydantic-settings>=2.0",
]
qr = ["segno>=1.6.0"]
# tollbooth.agent_keyring — the reusable agent keyring (a FastMCP proxy that signs a
# fresh proof per call). Only an agent runtime that runs the keyring installs this;
# FastMCP is imported lazily, never at module load.
keyring = [
    # 3.2.0 is the floor that closes GHSA-m8x7-r2rg-vh5g (command injection),
    # GHSA-rww4-4w9c-7733 (OAuth confused deputy), and GHSA-vv7q-7jx5-f767
    # (OpenAPI SSRF/path traversal). Versions through 3.1.1 remain vulnerable.
    "fastmcp>=3.2.0",
]
ots = []  # Reserved — no extra deps needed (uses stdlib hashlib + existing httpx)
x402 = [
    "x402>=2.8.0",
    "eth-account>=0.13.0",
]
constraints = []  # No external deps — stdlib only (datetime, zoneinfo, re)
# tollbooth.async_executor.ModalExecutor — detached execution that runs the
# operator's OWN registered runner, so no sealed closure, op vocabulary or
# generic interpreter flow is involved. `modal` is imported lazily, never at
# module load, so operators who never opt in do not need it installed.
modal = [
    "modal>=1.5",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    # Test-only. The SDK signs with pynostr; the Oracle verifies with
    # nostr-sdk. That cross-library seam is exactly the kind that breaks
    # silently, so the suite proves a signature we produce verifies under the
    # library that will actually check it. Not a runtime dependency.
    "nostr-sdk>=0.45.0,<0.46",
    # Test-only. The JSON-argument middleware is wired into a real FastMCP
    # server; a skipped wiring test would prove only that the parsing helper
    # works, which was never the part in doubt.
    "fastmcp>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/lonniev/tollbooth-dpyc"
Repository = "https://github.com/lonniev/tollbooth-dpyc"
Issues = "https://github.com/lonniev/tollbooth-dpyc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tollbooth"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `flows/` is the Prefect flow source. It is deliberately NOT in the wheel
# (`packages = ["src/tollbooth"]`) because Managed clones it from git at run
# time — but tests must still import it to prove `plan/v1` is a known op.
# CI runs with `--import-mode=importlib`, which does not put the rootdir on
# sys.path the way the default `prepend` mode does, so the tests passed locally
# and failed in CI with ModuleNotFoundError. This puts the repo root on the path
# under every import mode.
pythonpath = ["."]

[tool.coverage.run]
source = ["tollbooth"]
branch = true
# Relay drains and audit/notify publishers run on worker threads
# (asyncio.to_thread / threading.Thread) — measure them too.
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
# Report-only for now; a ratchet gate (--cov-fail-under) lands with M2.5
# once the tools/ extraction (M2.1) raises the measured floor.

[tool.mypy]
# Blocking gate (audit M2.5). The package type-checks clean at default
# strictness; do NOT add per-file overrides to silence new errors — fix the
# type, the way the 0.44.9 tranche bug and the 0.44.10 proof bug were caught.
files = ["src/tollbooth"]
ignore_missing_imports = true
