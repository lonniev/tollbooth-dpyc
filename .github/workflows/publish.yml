name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Publish only a commit that was reviewed onto main. A v* tag on any
      # other commit (a side branch, an unmerged PR) stops here, so a token
      # that can push tags cannot ship unreviewed code to PyPI (scan F26).
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit that was merged to main."
            exit 1
          fi
          echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on main."

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
