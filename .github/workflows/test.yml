name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,nostr,qr,authority,x402]"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        # -ra surfaces skip reasons so a silently-skipped module (e.g. a missing
        # optional extra) is visible in the log instead of reading as "all green".
        # Coverage ratchet (audit M2.5): --cov-fail-under is a floor, not a target.
        # Measured ~70% (2026-06-11); gate set at 67 for env/noise headroom. Raise
        # it as coverage climbs — never lower it.
        run: pytest tests/ -q -ra --cov=tollbooth --cov-report=term-missing:skip-covered --cov-fail-under=67 --import-mode=importlib
