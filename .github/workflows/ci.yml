name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,nostr,qr,authority,x402]"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Type check
        # Blocking gate (audit M2.5). Config in [tool.mypy]; mypy installed via
        # the dev extra. Surfaced the 0.44.9 tranche bug and 0.44.10 proof bug —
        # fix new errors, never silence them with per-file overrides.
        run: mypy

      - name: Run tests
        # -ra surfaces skip reasons so a silently-skipped module (e.g. a missing
        # optional extra) is visible in the log instead of reading as "all green".
        # Coverage ratchet (audit M2.5): --cov-fail-under is a floor, not a target.
        # Measured ~70% (2026-06-11); gate set at 67 for env/noise headroom. Raise
        # it as coverage climbs — never lower it.
        run: pytest tests/ -q -ra --cov=tollbooth --cov-report=term-missing:skip-covered --cov-fail-under=67 --import-mode=importlib

  # Stable, version-independent required check. Branch protection requires `test`,
  # which passes ONLY when every pytest matrix leg (3.12 + 3.13) succeeds — so a
  # matrix bump never orphans the required context. `always()` + an explicit result
  # check is deliberate: a bare `needs:` gate would be SKIPPED on failure, and a
  # skipped required check reads as passing.
  test:
    needs: [pytest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All pytest matrix legs passed
        run: |
          if [ "${{ needs.pytest.result }}" != "success" ]; then
            echo "pytest did not succeed: ${{ needs.pytest.result }}"; exit 1
          fi
          echo "pytest passed on all Python versions"
